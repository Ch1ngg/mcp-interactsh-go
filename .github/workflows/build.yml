name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Verify formatting
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race "-coverprofile=coverage.out" ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o bin/mcp-interactsh-go .

      - name: Smoke test (stdio tools/list)
        if: runner.os != 'Windows'
        run: |
          { printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; sleep 1; printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'; printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 2; } | ./bin/mcp-interactsh-go | tee stdio.out
          grep -q 'create_interactsh_session' stdio.out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-interactsh-go-${{ matrix.os }}
          path: bin/
